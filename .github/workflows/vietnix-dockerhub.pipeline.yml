name: Build, Push to Docker Hub & Deploy to Vietnix VPS

on:
  push:
    branches:
      - main
      - feature/merge
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      environment:
        description: "Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - development

jobs:
  check-connection:
    name: Check SSH Connection
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Check SSH and sudo access
        env:
          HOST: ${{ secrets.VIETNIX_HOST }}
          USERNAME: ${{ secrets.VIETNIX_USERNAME }}
          PASSWORD: ${{ secrets.VIETNIX_PASSWORD }}
        run: |
          set -e
          sshpass -p "$PASSWORD" ssh -p 8622 -o StrictHostKeyChecking=no "$USERNAME@$HOST" "echo 'VIETNIX connection OK'; \
            echo 'Checking sudo access...'; \
            echo \"$PASSWORD\" | sudo -S -p '' echo 'Sudo access confirmed' || echo 'Sudo access not required or failed'"

  build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: check-connection
    outputs:
      image_b64: ${{ steps.image-tag.outputs.image_b64 }}
      tag_b64: ${{ steps.image-tag.outputs.tag_b64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: image-tag
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DOCKER_USER_LOWER=$(echo "$DOCKER_USER" | tr '[:upper:]' '[:lower:]')
          IMAGE="${DOCKER_USER_LOWER}/dozu-embedding-service"

          # Determine tag based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_INPUT="${{ github.event.inputs.branch }}"
            ENV_INPUT="${{ github.event.inputs.environment }}"
            BRANCH_TAG="${BRANCH_INPUT//\//-}"
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="${ENV_INPUT}-${BRANCH_TAG}-${SHORT_SHA}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            BRANCH_TAG="${BRANCH_NAME//\//-}"
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="${BRANCH_TAG}-${SHORT_SHA}"
          fi

          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "image_b64=$(echo -n "$IMAGE" | base64 -w 0)" >> $GITHUB_OUTPUT
          echo "tag_b64=$(echo -n "$TAG" | base64 -w 0)" >> $GITHUB_OUTPUT

          echo "Building image: ${IMAGE}:${TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Vietnix VPS
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Pull image and restart container
        env:
          HOST: ${{ secrets.VIETNIX_HOST }}
          USERNAME: ${{ secrets.VIETNIX_USERNAME }}
          PASSWORD: ${{ secrets.VIETNIX_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          DEVICE: ${{ secrets.DEVICE }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
        run: |
          set -e
          IMAGE="$(printf '%s' '${{ needs.build-push.outputs.image_b64 }}' | base64 -d)"
          TAG="$(printf '%s' '${{ needs.build-push.outputs.tag_b64 }}' | base64 -d)"

          # Fallback in case outputs were masked/empty
          if [ -z "$IMAGE" ]; then 
            DOCKER_USER_LOWER=$(echo "$DOCKER_USER" | tr '[:upper:]' '[:lower:]')
            IMAGE="${DOCKER_USER_LOWER}/dozu-embedding-service"
          fi
          if [ -z "$TAG" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BRANCH_INPUT='${{ github.event.inputs.branch }}'
              ENV_INPUT='${{ github.event.inputs.environment }}'
              BRANCH_TAG="${BRANCH_INPUT//\//-}"
              SHORT_SHA="${GITHUB_SHA::7}"
              TAG="${ENV_INPUT}-${BRANCH_TAG}-${SHORT_SHA}"
            else
              BRANCH_NAME="${GITHUB_REF#refs/heads/}"
              BRANCH_TAG="${BRANCH_NAME//\//-}"
              SHORT_SHA="${GITHUB_SHA::7}"
              TAG="${BRANCH_TAG}-${SHORT_SHA}"
            fi
          fi

          echo "Deploying image: ${IMAGE}:${TAG}"

          REMOTE_CMDS=$(cat <<'BASH'
          set -e

          # Define variables
          CONTAINER_NAME="dozu-embedding-service"
          NETWORK_NAME="dozu-app-network"
          CONTAINER_PORT="8686"
          HOST_PORT="8686"
          VOLUME_NAME="dozu-embedding-service-logs"
          VOLUME_PATH="/app/logs"

          # Login to Docker Hub
          if command -v docker >/dev/null 2>&1; then
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin || true
          fi

          # Pull latest image
          echo "Pulling image: $IMAGE:$TAG"
          docker pull "$IMAGE:$TAG" || { echo "Docker pull failed"; exit 1; }

          # Stop and remove existing container if exists
          if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
            echo "Stopping existing container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
          fi

          # Create network if it doesn't exist
          docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || docker network create "$NETWORK_NAME"

          # Create volume if it doesn't exist
          docker volume inspect "$VOLUME_NAME" >/dev/null 2>&1 || docker volume create "$VOLUME_NAME"

          # Run container with environment variables
          echo "Starting new container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart always \
            --network "$NETWORK_NAME" \
            -e MODEL_NAME="$MODEL_NAME" \
            -e DEVICE="$DEVICE" \
            -e HUGGINGFACE_HUB_TOKEN="$HUGGINGFACE_HUB_TOKEN" \
            -p "$HOST_PORT:$CONTAINER_PORT" \
            -v "$VOLUME_NAME:$VOLUME_PATH" \
            "$IMAGE:$TAG"

          # Cleanup unused images
          echo "Cleaning up unused images..."
          docker image prune -a -f

          # Show running containers
          echo "Running containers:"
          docker ps

          # Show container logs
          echo "Container logs:"
          docker logs "$CONTAINER_NAME" --tail 50
          BASH
          )

          # Run remote commands with sudo and pass env vars explicitly
          sshpass -p "$PASSWORD" ssh -p 8622 -o StrictHostKeyChecking=no "$USERNAME@$HOST" \
            "command -v docker >/dev/null 2>&1 || { echo 'Docker is not installed on remote'; exit 1; }; \
            echo \"$PASSWORD\" | sudo -S -p '' env \
              DOCKER_USER='$DOCKER_USER' \
              DOCKER_TOKEN='$DOCKER_TOKEN' \
              IMAGE='$IMAGE' \
              TAG='$TAG' \
              MODEL_NAME='$MODEL_NAME' \
              DEVICE='$DEVICE' \
              HUGGINGFACE_HUB_TOKEN='$HUGGINGFACE_HUB_TOKEN' \
              bash -lc '$REMOTE_CMDS'"

      - name: Verify deployment
        env:
          HOST: ${{ secrets.VIETNIX_HOST }}
          USERNAME: ${{ secrets.VIETNIX_USERNAME }}
          PASSWORD: ${{ secrets.VIETNIX_PASSWORD }}
        run: |
          echo "Waiting for service to start..."
          sleep 10
          sshpass -p "$PASSWORD" ssh -p 8622 -o StrictHostKeyChecking=no "$USERNAME@$HOST" \
            "docker ps | grep dozu-embedding-service && echo 'Deployment successful!' || echo 'Warning: Container not found'"
